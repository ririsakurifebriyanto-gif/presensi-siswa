<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Test Kamera Presensi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    video {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
      margin-top: 20px;
      background: #000;
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
    }

    #pesan {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Presensi Siswa</h1>

  <p>SDN 1 UJUNGGEBANG</p>

  <button onclick="aktifkanKamera()">
    📷 AKTIFKAN KAMERA
  </button>

  <br>

  <video id="kamera" autoplay playsinline></video>

  <div id="pesan">
    Tekan tombol untuk mengaktifkan kamera.
  </div>


<script>

async function aktifkanKamera() {

  const pesan =
    document.getElementById("pesan");

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      pesan.textContent =
        "Browser tidak mendukung akses kamera.";

      return;
    }


    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });


    document.getElementById("kamera")
      .srcObject = stream;


    pesan.textContent =
      "✓ Kamera berhasil diaktifkan.";

  }

  catch (error) {

    pesan.textContent =
      "Gagal membuka kamera: " +
      error.name +
      " - " +
      error.message;

    console.error(error);

  }

}

</script>

</body>

</html>
